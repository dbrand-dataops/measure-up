    - Power BI model: star schema, DISTINCTCOUNT measures, RLS by faculty

- id: ms-exp-001
  type: explain
  language: modelling
  topic: conflicting-sources
  level: senior
  tags: [confidence]
  verified: false
  prompt: |-
    Banner and another system disagree about a student's status. How do you handle it?
  keyPoints:
    - Establish the system of record for each attribute and document it
    - Confirm the records genuinely match before comparing
    - Understand timing: refresh lag, as-at dates, and late updates
    - Log differences in an exceptions or reconciliation table with counts over time
    - Route fixes to the data owner, correcting at source rather than patching downstream
    - Do not silently override one system in the model

- id: sec-exp-001
  type: explain
  language: security
  topic: governance
  level: senior
  tags: [confidence]
  verified: false
  prompt: |-
    Explain your access design for student data to a data protection officer.
  keyPoints:
