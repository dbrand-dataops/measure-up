- id: bn-exp-001
  type: explain
  language: he-data
  topic: end-to-end
  level: senior
  tags: [confidence, most-asked]
  verified: false
  prompt: |-
    Walk me through building a student retention report from Banner plus a separate widening participation dataset.
  keyPoints:
    - Agree the definition first: cohort, follow-up point, exclusions, as-at date
    - Land Banner raw in the warehouse, model with dbt, declare the grain
    - Current-row and effective-dating logic for identity and student records
    - Identity reconciliation to the second dataset, with a mapping table, match tiers and an exceptions list
    - Snapshots so figures are reproducible
    - Disclosure control for small counts and special category fields
