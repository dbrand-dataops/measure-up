# ---------------------------------------------------------------- PATTERN LIBRARY

- id: bn-pat-001
  type: pattern
  language: sql
  topic: identity
  level: mid
  tags: [interview-staple]
  verified: false
  name: Current person row from SPRIDEN
  scenario: |-
    Staging model with one current identity row per person.
  code: |-
    select
        spriden_pidm       as pidm,
        spriden_id         as student_id,
        spriden_first_name as first_name,
        spriden_last_name  as last_name
    from {{ source('banner', 'spriden') }}
    where spriden_change_ind is null
      and spriden_entity_ind = 'P'
  notes: |-
    Add a dbt unique and not_null test on pidm. If the test fails, you have duplicate current rows in the source, which is itself a finding to report.

- id: bn-pat-002
  type: pattern
  language: sql
  topic: effective-dating
  level: senior
  tags: [interview-staple]
  verified: false
  name: Student record as at a term
  scenario: |-
    The effective-dated student row that applied in a given term.
  code: |-
    select *
    from {{ ref('stg_sgbstdn') }}
    where term_code_eff <= '202410'
    qualify row_number() over (
        partition by pidm
        order by term_code_eff desc
    ) = 1
  notes: |-
    String comparison works because term codes sort lexicographically in YYYYMM style. Check this holds for your codes. Parameterise the term in the model or a macro.

- id: ms-pat-001
  type: pattern
  language: sql
  topic: identity-reconciliation
  level: mid
  tags: [interview-staple]
  verified: false
  name: Unmatched records in either source
  scenario: |-
    Reconciliation report listing students that exist in only one of two systems.
  code: |-
    select
        coalesce(b.student_id_norm, o.student_id_norm) as student_id_norm,
        case
            when o.student_id_norm is null then 'Banner only'
            when b.student_id_norm is null then 'Other system only'
        end as status
    from banner_students b
    full outer join other_students o
        on b.student_id_norm = o.student_id_norm
    where b.student_id_norm is null
       or o.student_id_norm is null
  notes: |-
    Pair this with a count summary (rows and distinct keys per source, matched, unmatched) so you can show the reconciliation moving over time.

- id: he-pat-001
  type: pattern
  language: dax
  topic: non-additive-measures
  level: junior
  tags: [interview-staple]
  verified: false
  name: Student headcount
  scenario: |-
    Count each student once in any context.
  code: |-
    Headcount = DISTINCTCOUNT ( Registration[StudentID] )
  notes: |-
    If a Student dimension has one row per student and the relationship is single direction, COUNTROWS(Student) is an alternative that respects filters from the fact via the relationship only when a filter is applied to the fact side. Know which applies in your model.

- id: he-pat-002
  type: pattern
  language: dax
  topic: retention
  level: senior
  tags: [interview-staple]
  verified: false
  name: Cohort retention
  scenario: |-
    Share of a base-term cohort still enrolled in a follow-up term.
  code: |-
    Cohort =
    CALCULATE ( DISTINCTCOUNT ( Enrolment[StudentID] ), Enrolment[Term] = "202410" )

    Retained =
    VAR _Base =
        CALCULATETABLE ( VALUES ( Enrolment[StudentID] ), Enrolment[Term] = "202410" )
    RETURN
        CALCULATE (
            DISTINCTCOUNT ( Enrolment[StudentID] ),
            Enrolment[Term] = "202510",
            TREATAS ( _Base, Enrolment[StudentID] )
        )

    Retention % = DIVIDE ( [Retained], [Cohort] )
  notes: |-
    Terms are hard-coded for clarity. A real version takes the base and follow-up terms from disconnected parameter tables. It also needs the exclusions and cohort filters agreed in the definition.

- id: he-pat-003
  type: pattern
  language: dax
  topic: snapshots
  level: senior
  tags: [interview-staple]
  verified: false
  name: Closing headcount for a period
  scenario: |-
    Point-in-time headcount that does not sum across time.
  code: |-
    Snapshot Rows = COUNTROWS ( Snapshot )

    Closing Headcount =
    CALCULATE (
        SUM ( Snapshot[Headcount] ),
        LASTNONBLANK ( 'Date'[Date], [Snapshot Rows] )
    )
  notes: |-
    LASTNONBLANK handles periods whose last day has no snapshot. LASTDATE is simpler when snapshots always fall on the last day.

- id: he-pat-004
  type: pattern
  language: dax
  topic: governance
  level: mid
  tags: [interview-staple]
  verified: false
  name: Small-number suppression and rounding
  scenario: |-
    Apply a disclosure-control rule inside the measure.
  code: |-
    Headcount Safe =
    VAR _n = [Headcount]
    RETURN
        IF ( _n < 5, BLANK (), MROUND ( _n, 5 ) )
  notes: |-
    The threshold and rounding must follow your institution's agreed rule. Suppressing cells does not stop disclosure through totals, so check subtotals and consider complementary suppression.

- id: ms-pat-002
  type: pattern
  language: dax
  topic: multiple-sources
  level: senior
  tags: [interview-staple]
  verified: false
  name: Virtual relationship to a second source
  scenario: |-
    Count CRM contacts for the students currently in filter context without a physical relationship.
  code: |-
    CRM Contacts =
    CALCULATE (
        COUNTROWS ( Crm ),
        TREATAS ( VALUES ( Student[StudentID] ), Crm[StudentID] )
    )
  notes: |-
    Useful when two sources cannot be related directly, such as across source groups in a composite model. Both columns must share the same data type and format, so standardise keys first.

- id: ms-pat-003
  type: pattern
  language: m
  topic: key-standardisation
  level: mid
  tags: [interview-staple]
  verified: false
  name: Standardise a join key across sources
  scenario: |-
    Make IDs from two systems comparable before a merge.
  code: |-
    Standardised = Table.TransformColumns(
        Source,
        {{"StudentID", each Text.PadStart(Text.Trim(Text.From(_)), 8, "0"), type text}}
    )
  notes: |-
    Do this in the staging step of each source query, then merge. Check the match rate after the merge rather than assuming it worked.

- id: ms-pat-004
  type: pattern
  language: m
  topic: combining-files
  level: mid
  tags: [interview-staple]
  verified: false
  name: Combine workbooks from a folder
  scenario: |-
    Append monthly Excel returns from several departments.
  code: |-
    let
        Source = Folder.Files("C:\Data\Returns"),
        Xlsx = Table.SelectRows(Source, each [Extension] = ".xlsx" and not Text.StartsWith([Name], "~$")),
        Parsed = Table.AddColumn(
            Xlsx,
            "Data",
            each Table.PromoteHeaders(Excel.Workbook([Content]){0}[Data], [PromoteAllScalars = true])
        ),
        Combined = Table.Combine(Parsed[Data])
    in
        Combined
  notes: |-
    Table.Combine matches by column name, so standardise headers per file first. Excel lock files (names starting ~$) must be excluded. Path and sheet index are placeholders.
