- id: uni-pat-016
  type: pattern
  language: sql
  topic: window-functions
  level: mid
  tags: [interview-staple]
  verified: false
  name: Final attempt per student per module
  scenario: |-
    One row per student and module, using the latest attempt.
  code: |-
    select *
    from {{ ref('stg_module_result') }}
    qualify row_number() over (
        partition by student_key, module_key
        order by attempt_no desc
    ) = 1
  notes: |-
    Regulations decide whether the final mark is the latest attempt, the best, or a capped resit mark. Encode the rule once, in the warehouse.

- id: uni-pat-017
  type: pattern
  language: sql
  topic: retention
  level: senior
  tags: [interview-staple]
  verified: false
  name: Cohort retention in SQL
  scenario: |-
    Entrants in 2023/24 who are enrolled in 2024/25.
  code: |-
    with entrants as (
        select distinct student_key
        from enrolment
        where academic_year = '2023/24'
          and entry_year_flag = 1
    ),
    next_year as (
        select distinct student_key
        from enrolment
        where academic_year = '2024/25'
    )
    select
        count(*)                            as cohort,
        count(n.student_key)                as retained,
        count(n.student_key) / nullif(count(*), 0) as retention_rate
    from entrants e
    left join next_year n using (student_key)
  notes: |-
    LEFT JOIN keeps cohort members who left, and COUNT over the right-hand key counts only matches. Exclusions and cohort filters (level, mode, domicile) must follow the agreed definition. entry_year_flag is a placeholder.

- id: uni-pat-018
  type: pattern
  language: sql
  topic: as-at-join
  level: senior
  tags: [interview-staple]
  verified: false
  name: As-at join to a history dimension
  scenario: |-
    Attach the department that applied when each result was recorded.
  code: |-
    select r.*, d.department_code
    from module_result r
    join dim_student_history d
      on  d.student_key = r.student_key
      and r.result_date >= d.valid_from
      and r.result_date <  coalesce(d.valid_to, '9999-12-31'::date)
  notes: |-
    Half-open intervals prevent double matches at version boundaries. Add a dbt test that validity ranges do not overlap per student.

- id: uni-pat-019
  type: pattern
  language: sql
  topic: window-functions
  level: mid
  tags: [interview-staple]
  verified: false
  name: Cumulative applications by week
  scenario: |-
    Weekly and cumulative application counts for the cycle.
  code: |-
    select
        date_trunc('week', application_date)                       as week_start,
        count(*)                                                    as applications,
        sum(count(*)) over (order by date_trunc('week', application_date)) as cumulative_applications
    from application
    where academic_year_start = 2025
    group by date_trunc('week', application_date)
    order by week_start
  notes: |-
    A window function can wrap an aggregate. Add a partition by programme or school for per-group running totals.

- id: uni-pat-020
  type: pattern
  language: sql
  topic: data-quality
  level: mid
  tags: [interview-staple]
  verified: false
  name: Orphan and duplicate checks
  scenario: |-
    Quick checks before loading a model.
  code: |-
    -- Fact rows whose school code is missing from the dimension
    select count(*) as orphan_rows
    from fct_enrolment f
    left join dim_school s on s.school_code = f.school_code
    where s.school_code is null;

    -- Duplicate keys in a dimension
    select student_key, count(*) as n
    from dim_student
    group by student_key
    having count(*) > 1;
  notes: |-
    In dbt these become relationships and unique tests. Track the counts over time rather than only failing the build.

- id: uni-pat-021
  type: pattern
  language: sql
  topic: pivoting
  level: junior
  tags: [interview-staple]
  verified: false
  name: Conditional aggregation pivot
  scenario: |-
    One row per student and module with Coursework, Exam and Practical marks as columns.
  code: |-
    select
        student_key,
        module_key,
        max(case when component = 'Coursework' then mark end) as coursework,
        max(case when component = 'Exam'       then mark end) as exam,
        max(case when component = 'Practical'  then mark end) as practical
    from assessment_component
    group by student_key, module_key
  notes: |-
    Each student and component pair should be unique, otherwise MAX hides duplicates. Snowflake also has PIVOT, but conditional aggregation is portable and easier to extend.
