- id: uni-pat-012
  type: pattern
  language: m
  topic: unpivot
  level: mid
  tags: [interview-staple]
  verified: false
  name: Unpivot assessment components
  scenario: |-
    Turn Coursework, Exam, Practical columns into one row per component.
  code: |-
    Unpivoted = Table.UnpivotOtherColumns (
        Source,
        { "StudentID", "ModuleCode" },
        "Component",
        "Mark"
    )
  notes: |-
    Unpivoting other columns survives new component columns. Follow with a type step and handle status codes in Mark before converting to number.

- id: uni-pat-013
  type: pattern
  language: m
  topic: merges
  level: mid
  tags: [interview-staple]
  verified: false
  name: Students with no enrolment
  scenario: |-
    Find students in the extract that are missing from the Enrolment query.
  code: |-
    let
        Joined = Table.NestedJoin ( Students, { "StudentKey" }, Enrolment, { "StudentKey" }, "Match", JoinKind.LeftAnti ),
        Result = Table.RemoveColumns ( Joined, { "Match" } )
    in
        Result
  notes: |-
    LeftAnti returns left rows with no right match. For deterministic comparison, standardise the key in both queries first.

- id: uni-pat-014
  type: pattern
  language: m
  topic: parameters
  level: mid
  tags: [interview-staple]
  verified: false
  name: Parameterised academic year filter
  scenario: |-
    Filter a source by an academic year parameter that can differ between Dev, Test and Prod.
  code: |-
    let
        Source = Sql.Database ( pServer, pDatabase ),
        Enrolment = Source{ [Schema = "mart", Item = "fct_enrolment"] }[Data],
        Filtered = Table.SelectRows ( Enrolment, each [AcademicYearStart] >= pFirstAcademicYear )
    in
        Filtered
  notes: |-
    A simple comparison against a parameter folds. Deployment pipeline rules can swap pServer, pDatabase and pFirstAcademicYear per stage.

- id: uni-pat-015
  type: pattern
  language: m
  topic: dates
  level: junior
  tags: [interview-staple]
  verified: false
  name: UK date parsing
  scenario: |-
    Convert text dates in dd/mm/yyyy format regardless of the machine locale.
  code: |-
    Typed = Table.TransformColumnTypes ( Source, { { "EnrolDate", type date } }, "en-GB" )
  notes: |-
    Culture is the third argument. Without it, results depend on the locale of the machine or the service.

